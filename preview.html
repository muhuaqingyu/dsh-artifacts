<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线预览 · 扬子江药业招投标系统</title>
<style>
html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef1f6;color:#1f2d3d}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #e3e9f2;flex-wrap:wrap}
.bar .tt{font-size:14px;font-weight:600}
.bar .meta{font-size:12px;color:#8b98ab}
.bar .sp{flex:1}
.bar a{font-size:13px;text-decoration:none;border-radius:6px;padding:7px 14px;border:1px solid #cdd8e6;color:#39506e;background:#fff}
.bar a.pri{background:#1f5fbf;border-color:#1f5fbf;color:#fff}
.bar a:hover{opacity:.9}
.wrap{height:calc(100% - 53px)}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.fallback{display:none;padding:40px 24px;font-size:14px;line-height:1.9;color:#5b6b82}
@media (max-width:640px){ .bar .meta{display:none} }
</style></head>
<body>
<div class="bar">
  <span class="tt" id="tt">在线预览</span>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <a class="pri" id="open" target="_blank" rel="noopener">新窗口打开</a>
  <a id="dlpdf" download>下载 PDF</a>
  <a id="dldoc" download>下载 Word</a>
  <a href="./">返回目录</a>
</div>
<div class="wrap"><iframe id="fr" title="文档预览"></iframe></div>
<div class="fallback" id="fb">
  当前浏览器未能内嵌显示 PDF。<a id="fbopen" target="_blank" rel="noopener">点这里在新窗口打开</a>，或用右上角「下载 PDF / 下载 Word」。
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var f = q.get('f') || 'PRD-V3.5.pdf';
  var w = q.get('w') || '';
  var t = q.get('t') || f;
  var m = q.get('m') || '';
  document.title = '在线预览 · ' + t;
  document.getElementById('tt').textContent = t;
  document.getElementById('meta').textContent = m;
  var fr = document.getElementById('fr');
  fr.src = f + '#view=FitH';
  document.getElementById('open').href = f;
  document.getElementById('dlpdf').href = f;
  var d = document.getElementById('dldoc');
  if (w) { d.href = w; } else { d.style.display = 'none'; }
  document.getElementById('fbopen').href = f;
  setTimeout(function(){
    try {
      var hasPdf = !!(fr.contentDocument && fr.contentDocument.querySelector('embed,object')) || navigator.mimeTypes['application/pdf'];
      if (!hasPdf) { document.getElementById('fb').style.display = 'block'; }
    } catch(e){}
  }, 1200);
})();
</script>
</body></html>
