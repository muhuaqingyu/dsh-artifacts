<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>需要访问密码 · 扬子江药业招投标系统</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef3fb,#f7f9fc 55%,#eaf0f8);color:#1f2d3d}
.box{width:min(400px,88vw);background:#fff;border:1px solid #e3e9f2;border-radius:12px;padding:30px 28px 24px;box-shadow:0 12px 34px rgba(31,60,110,.10)}
h1{font-size:17px;margin:0 0 6px}
.sub{font-size:12.5px;color:#7b8aa0;line-height:1.7;margin:0 0 20px}
label{display:block;font-size:12.5px;color:#5b6b82;margin-bottom:6px}
input{width:100%;box-sizing:border-box;height:40px;border:1px solid #d6dfec;border-radius:7px;padding:0 12px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:#1f5fbf;box-shadow:0 0 0 3px rgba(31,95,191,.12)}
button{width:100%;height:40px;margin-top:14px;border:0;border-radius:7px;background:#1f5fbf;color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#c0392b;font-size:12.5px;min-height:18px;margin-top:10px}
.foot{margin-top:16px;font-size:11.5px;color:#9aa8bb;line-height:1.7}
</style></head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>扬子江药业招投标系统</h1>
  <p class="sub">进入交付目录需输入访问密码；目录内的原型与文档打开时不再询问。</p>
  <label for="pw">访问密码</label>
  <input id="pw" type="password" placeholder="请输入密码" autofocus>
  <button id="go" type="submit">进入目录</button>
  <div class="err" id="err"></div>
  <div class="foot">首次输入后本机保持登录；如需在本机退出，可在目录页底部点「清除本机密码」。</div>
</form>
<script>
(function(){
  var SALT=Uint8Array.from(atob('DOmb7VNfX2AID8C7LkQxSg=='),function(c){return c.charCodeAt(0);});
  var ITER=200000, KEY='yzj_key';
  var cached=null; try { cached=localStorage.getItem(KEY); } catch(e){}
  function openLanding(kb64){
    try { localStorage.setItem(KEY,kb64); } catch(e){}
    fetch('pages/landing.enc',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.arrayBuffer();
    }).then(function(buf){
      var raw=Uint8Array.from(atob(kb64),function(c){return c.charCodeAt(0);});
      return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt'])
        .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},k,new Uint8Array(buf,12)); });
    }).then(function(plain){
      var u=URL.createObjectURL(new Blob([plain],{type:'text/html'}));
      location.replace(u);
    }).catch(function(e){ document.getElementById('err').textContent='加载失败：'+e.message; document.getElementById('go').disabled=false; });
  }
  if(cached){ openLanding(cached); }
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var pw=document.getElementById('pw').value; if(!pw) return;
    var go=document.getElementById('go'); go.disabled=true; document.getElementById('err').textContent='';
    crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey'])
      .then(function(base){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']); })
      .then(function(k){ return fetch('pages/check.enc',{cache:'no-store'}).then(function(r){return r.arrayBuffer();}).then(function(buf){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},k,new Uint8Array(buf,12)).then(function(){ return crypto.subtle.exportKey('raw',k); });
      }); })
      .then(function(raw){ var b64=btoa(String.fromCharCode.apply(null,new Uint8Array(raw))); openLanding(b64); })
      .catch(function(){ go.disabled=false; document.getElementById('pw').select(); document.getElementById('err').textContent='密码不正确，请重试'; });
  });
})();
</script>
</body></html>
